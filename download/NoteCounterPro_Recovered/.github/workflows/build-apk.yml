name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Create gradlew
      run: |
        cat > gradlew << 'GRADLEW'
        #!/bin/sh
        exec gradle "$@"
        GRADLEW
        chmod +x gradlew

    - name: Create local.properties
      run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

    - name: Build Debug APK
      run: ./gradlew assembleDebug 2>&1 || true

    - name: Find APK
      run: find . -name "*.apk" -type f 2>/dev/null

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: note-counter-pro-apk
        path: '**/*.apk'
        if-no-files-found: warn
