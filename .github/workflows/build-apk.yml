name: Build APK with apktool

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Download apktool
      run: |
        # Try multiple sources for apktool
        wget -q "https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar" -O apktool.jar || \
        curl -sL "https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar" -o apktool.jar
        ls -lh apktool.jar

    - name: Prepare apktool project
      run: |
        # Create the apktool project structure from decompiled_resources
        mkdir -p apktool_project
        
        # Copy the apktool decompiled output
        cp -r decompiled_resources/* apktool_project/ 2>/dev/null || true
        
        # Also copy from the app directory if needed
        if [ ! -f "apktool_project/AndroidManifest.xml" ]; then
          cp app/src/main/AndroidManifest.xml apktool_project/
        fi
        
        # Copy assets from app directory
        if [ -d "app/src/main/assets" ]; then
          cp -r app/src/main/assets/* apktool_project/assets/ 2>/dev/null || true
        fi
        
        # Copy smali code
        cp -r smali_code/* apktool_project/smali/ 2>/dev/null || mkdir -p apktool_project/smali
        
        echo "=== apktool_project structure ==="
        ls -la apktool_project/
        ls apktool_project/smali/ | head -10

    - name: Build APK with apktool
      run: |
        java -jar apktool.jar b apktool_project -o note-counter-pro-debug.apk 2>&1 || true
        ls -lh *.apk 2>/dev/null || echo "No APK built"

    - name: Sign APK (debug)
      run: |
        if [ -f "note-counter-pro-debug.apk" ]; then
          # Generate a debug keystore
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          
          # Sign the APK
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore debug.keystore -storepass android -keypass android note-counter-pro-debug.apk androiddebugkey
          
          # Verify
          jarsigner -verify note-counter-pro-debug.apk
        fi

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: note-counter-pro-apk
        path: '*.apk'
        if-no-files-found: warn

    - name: Create Release with APK
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.7.0-recovered
        name: Note Counter Pro v2.7.0 (Recovered)
        files: '*.apk'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
