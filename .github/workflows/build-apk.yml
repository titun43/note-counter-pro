name: Build APK with apktool

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Download apktool
      run: |
        wget -q "https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar" -O apktool.jar

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install build-tools
      run: |
        sdkmanager "build-tools;34.0.0"

    - name: Prepare and build APK
      run: |
        mkdir -p apktool_project/smali
        
        # Copy all decompiled resources
        cp -r decompiled_resources/* apktool_project/
        
        # Remove classes.dex (apktool uses smali instead)
        rm -f apktool_project/classes.dex
        rm -f apktool_project/*.properties
        
        # Copy smali code
        cp -r smali_code/* apktool_project/smali/
        
        # Remove leftover dailylifepro package
        rm -rf apktool_project/smali/com/lokhnathtechnical/dailylifepro
        
        # Copy other required files
        cp -r unknown_files/* apktool_project/unknown/ 2>/dev/null || mkdir -p apktool_project/unknown
        cp -r original_signing/* apktool_project/original/ 2>/dev/null || mkdir -p apktool_project/original
        cp -r kotlin_metadata apktool_project/kotlin 2>/dev/null || true
        
        echo "=== Building APK ==="
        java -jar apktool.jar b apktool_project -o app-unsigned.apk

    - name: Sign APK with apksigner (v1+v2+v3)
      run: |
        # Find zipalign and apksigner
        BUILD_TOOLS=$(ls -d ${ANDROID_HOME}/build-tools/*/ | sort -V | tail -1)
        echo "Using build-tools: $BUILD_TOOLS"
        
        if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
          echo "Using custom keystore from secrets..."
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          KS_PASS="${{ secrets.KEYSTORE_PASSWORD }}"
          KP_PASS="${{ secrets.KEY_PASSWORD }}"
          KS_ALIAS="${{ secrets.KEY_ALIAS }}"
        else
          echo "Creating debug keystore..."
          keytool -genkeypair -v -keystore debug.keystore -alias key0 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          KS_PASS="android"
          KP_PASS="android"
          KS_ALIAS="key0"
          cp debug.keystore release.keystore
        fi
        
        # Step 1: zipalign
        echo "=== Zipaligning APK ==="
        ${BUILD_TOOLS}zipalign -f 4 app-unsigned.apk app-aligned.apk
        
        # Step 2: Sign with apksigner (v1+v2+v3)
        echo "=== Signing with apksigner (v1+v2+v3) ==="
        ${BUILD_TOOLS}apksigner sign \
          --ks release.keystore \
          --ks-pass pass:${KS_PASS} \
          --ks-key-alias ${KS_ALIAS} \
          --key-pass pass:${KP_PASS} \
          --v1-signing-enabled true \
          --v2-signing-enabled true \
          --v3-signing-enabled true \
          --out note-counter-pro-signed.apk \
          app-aligned.apk
        
        # Verify signing
        echo "=== Verifying APK signature ==="
        ${BUILD_TOOLS}apksigner verify --verbose note-counter-pro-signed.apk
        
        mv note-counter-pro-signed.apk note-counter-pro-debug.apk
        ls -lh note-counter-pro-debug.apk

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-apk
        path: note-counter-pro-debug.apk

    - name: Create Release with APK
      run: |
        TOKEN="${{ secrets.GITHUB_TOKEN }}"
        REPO="${{ github.repository }}"
        
        # Delete old release if exists
        for tag in v2.7.0-recovered v2.7.0-fixed; do
          ID=$(curl -s -H "Authorization: token $TOKEN" \
            "https://api.github.com/repos/$REPO/releases/tags/$tag" | \
            python3 -c "import json,sys; print(json.load(sys.stdin).get('id',''))" 2>/dev/null)
          if [ -n "$ID" ]; then
            curl -s -X DELETE -H "Authorization: token $TOKEN" "https://api.github.com/repos/$REPO/releases/$ID"
            curl -s -X DELETE -H "Authorization: token $TOKEN" "https://api.github.com/repos/$REPO/git/refs/tags/$tag"
          fi
        done
        
        # Create new release
        curl -X POST -H "Authorization: token $TOKEN" \
          -H "Content-Type: application/json" \
          "https://api.github.com/repos/$REPO/releases" \
          -d '{
            "tag_name": "v2.7.0-recovered",
            "name": "Note Counter Pro v2.7.0 (Recovered)",
            "body": "APK rebuilt from decompiled sources with v1+v2+v3 signing.\nPackage: com.lokhnathtechnical.notecounterpro",
            "draft": false,
            "prerelease": true
          }' > release.json
        
        UPLOAD_URL=$(python3 -c "import json; print(json.load(open('release.json'))['upload_url'].replace('{?name,label}',''))")
        
        curl -X POST -H "Authorization: token $TOKEN" \
          -H "Content-Type: application/vnd.android.package-archive" \
          --data-binary @note-counter-pro-debug.apk \
          "$UPLOAD_URL?name=note-counter-pro-debug.apk"
