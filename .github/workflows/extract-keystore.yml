name: Extract Keystore (One Time)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
    - name: Decode and save keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > note-counter-pro.keystore
        ls -la note-counter-pro.keystore
        file note-counter-pro.keystore
        
        # Also create a key.properties file for reference
        cat > key.properties << 'EOF'
        storeFile=note-counter-pro.keystore
        storePassword=${{ secrets.KEYSTORE_PASSWORD }}
        keyAlias=${{ secrets.KEY_ALIAS }}
        keyPassword=${{ secrets.KEY_PASSWORD }}
        EOF
        
        # Verify the keystore
        keytool -list -keystore note-counter-pro.keystore -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -alias "${{ secrets.KEY_ALIAS }}" || true

    - name: Upload keystore as artifact
      uses: actions/upload-artifact@v4
      with:
        name: keystore-file
        path: |
          note-counter-pro.keystore
          key.properties
        retention-days: 1
