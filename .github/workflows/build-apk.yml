name: Build APK with apktool

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Download apktool
      run: |
        wget -q "https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar" -O apktool.jar

    - name: Prepare and build APK
      run: |
        mkdir -p apktool_project/smali
        
        # Copy all decompiled resources
        cp -r decompiled_resources/* apktool_project/
        
        # Remove classes.dex (apktool uses smali instead)
        rm -f apktool_project/classes.dex
        rm -f apktool_project/*.properties
        
        # Copy smali code (excluding dailylifepro)
        cp -r smali_code/* apktool_project/smali/
        
        # Remove leftover dailylifepro package
        rm -rf apktool_project/smali/com/lokhnathtechnical/dailylifepro
        
        # Copy other required files
        cp -r unknown_files/* apktool_project/unknown/ 2>/dev/null || mkdir -p apktool_project/unknown
        cp -r original_signing/* apktool_project/original/ 2>/dev/null || mkdir -p apktool_project/original
        cp -r kotlin_metadata apktool_project/kotlin 2>/dev/null || true
        
        echo "=== Building APK ==="
        java -jar apktool.jar b apktool_project -o app-unsigned.apk
        
        echo "=== Signing APK ==="
        keytool -genkeypair -v -keystore debug.keystore -alias key0 \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass android -keypass android \
          -dname "CN=Android Debug,O=Android,C=US"
        
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
          -keystore debug.keystore -storepass android -keypass android \
          app-unsigned.apk key0
        
        mv app-unsigned.apk note-counter-pro-debug.apk
        jarsigner -verify note-counter-pro-debug.apk
        ls -lh note-counter-pro-debug.apk

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-apk
        path: note-counter-pro-debug.apk

    - name: Create Release with APK
      run: |
        # Delete old release if exists
        curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          "https://api.github.com/repos/${{ github.repository }}/releases/tags/v2.7.0-recovered" | \
          python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('id','none'))" > release_id.txt
        
        OLD_ID=$(cat release_id.txt)
        if [ "$OLD_ID" != "none" ]; then
          curl -s -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/$OLD_ID"
          curl -s -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/v2.7.0-recovered"
        fi
        
        # Create new release
        curl -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Content-Type: application/json" \
          "https://api.github.com/repos/${{ github.repository }}/releases" \
          -d '{
            "tag_name": "v2.7.0-recovered",
            "name": "Note Counter Pro v2.7.0 (Recovered - Fixed)",
            "body": "APK rebuilt from decompiled sources. Debug signed. Fixed package name.",
            "draft": false,
            "prerelease": true
          }' > release.json
        
        UPLOAD_URL=$(python3 -c "import json; print(json.load(open('release.json'))['upload_url'].replace('{?name,label}',''))")
        
        curl -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Content-Type: application/vnd.android.package-archive" \
          --data-binary @note-counter-pro-debug.apk \
          "$UPLOAD_URL?name=note-counter-pro-debug.apk"
