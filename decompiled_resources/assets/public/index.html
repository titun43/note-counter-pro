// === Simple QR code generator (numeric mode, works for UPI URLs) ===
// Based on QR Code generation - minimal implementation for byte data
function makeQrCanvas(text, size) {
  size = size || 240;
  // Use Google Chart API as fallback via image (canvas can be drawn from it)
  // For now use a simpler approach - create canvas with text
  var canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  var ctx = canvas.getContext('2d');
  // White background
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, size, size);
  // We'll use external QR image, draw onto canvas
  var img = new Image();
  img.crossOrigin = 'anonymous';
  var qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=' + size + 'x' + size + '&data=' + encodeURIComponent(text);
  img.src = qrUrl;
  img.onload = function() {
    ctx.drawImage(img, 0, 0, size, size);
  };
  // Return canvas immediately (image draws when loaded)
  return { canvas: canvas, qrUrl: qrUrl, img: img };
}

// === CSV Export ===
function escapeCsv(v) {
  if (v === null || v === undefined) return '';
  var s = String(v);
  if (s.indexOf(',') !== -1 || s.indexOf('"') !== -1 || s.indexOf('\n') !== -1) {
    return '"' + s.replace(/"/g, '""') + '"';
  }
  return s;
}

function downloadFile(content, filename, mimeType) {
  var blob = new Blob([content], { type: mimeType });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
}
