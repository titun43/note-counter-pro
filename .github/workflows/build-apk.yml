name: Build APK and AAB with apktool

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Download apktool
      run: |
        wget -q "https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar" -O apktool.jar

    - name: Download bundletool
      run: |
        wget -q "https://github.com/google/bundletool/releases/download/1.17.0/bundletool-all-1.17.0.jar" -O bundletool.jar

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4

    - name: Install build-tools and platforms
      run: |
        sdkmanager --install "build-tools;35.0.0" "platforms;android-36"

    - name: Prepare and build APK
      run: |
        mkdir -p apktool_project/smali
        
        # Copy all decompiled resources
        cp -r decompiled_resources/* apktool_project/
        
        # Remove classes.dex (apktool uses smali instead)
        rm -f apktool_project/classes.dex
        rm -f apktool_project/*.properties
        
        # Copy smali code
        cp -r smali_code/* apktool_project/smali/
        
        # Remove leftover dailylifepro package
        rm -rf apktool_project/smali/com/lokhnathtechnical/dailylifepro
        
        # Copy other required files
        cp -r unknown_files/* apktool_project/unknown/ 2>/dev/null || mkdir -p apktool_project/unknown
        cp -r original_signing/* apktool_project/original/ 2>/dev/null || mkdir -p apktool_project/original
        cp -r kotlin_metadata apktool_project/kotlin 2>/dev/null || true
        
        echo "=== Building APK ==="
        java -jar apktool.jar b apktool_project -o app-unsigned.apk

    - name: Sign APK with apksigner (v1+v2+v3)
      run: |
        # Find zipalign and apksigner
        BUILD_TOOLS=$(ls -d ${ANDROID_HOME}/build-tools/*/ | sort -V | tail -1)
        echo "Using build-tools: $BUILD_TOOLS"
        
        if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
          echo "Using custom keystore from secrets..."
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          KS_PASS="${{ secrets.KEYSTORE_PASSWORD }}"
          KP_PASS="${{ secrets.KEY_PASSWORD }}"
          KS_ALIAS="${{ secrets.KEY_ALIAS }}"
        else
          echo "Creating debug keystore..."
          keytool -genkeypair -v -keystore debug.keystore -alias key0 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          KS_PASS="android"
          KP_PASS="android"
          KS_ALIAS="key0"
          cp debug.keystore release.keystore
        fi
        
        # Step 1: zipalign
        echo "=== Zipaligning APK ==="
        ${BUILD_TOOLS}zipalign -f 4 app-unsigned.apk app-aligned.apk
        
        # Step 2: Sign with apksigner (v1+v2+v3)
        echo "=== Signing with apksigner (v1+v2+v3) ==="
        ${BUILD_TOOLS}apksigner sign \
          --ks release.keystore \
          --ks-pass pass:${KS_PASS} \
          --ks-key-alias ${KS_ALIAS} \
          --key-pass pass:${KP_PASS} \
          --v1-signing-enabled true \
          --v2-signing-enabled true \
          --v3-signing-enabled true \
          --out note-counter-pro-signed.apk \
          app-aligned.apk
        
        # Verify signing
        echo "=== Verifying APK signature ==="
        ${BUILD_TOOLS}apksigner verify --verbose note-counter-pro-signed.apk
        
        mv note-counter-pro-signed.apk note-counter-pro.apk
        ls -lh note-counter-pro.apk

    - name: Build AAB from APK
      run: |
        BUILD_TOOLS=$(ls -d ${ANDROID_HOME}/build-tools/*/ | sort -V | tail -1)
        AAPT2="${BUILD_TOOLS}aapt2"
        APKSIGNER="${BUILD_TOOLS}apksigner"
        
        if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
          KS_PASS="${{ secrets.KEYSTORE_PASSWORD }}"
          KP_PASS="${{ secrets.KEY_PASSWORD }}"
          KS_ALIAS="${{ secrets.KEY_ALIAS }}"
        else
          KS_PASS="android"
          KP_PASS="android"
          KS_ALIAS="key0"
        fi
        
        echo "=== STEP 1: Convert APK to proto format ==="
        $AAPT2 convert --output-format proto -o app-proto.apk note-counter-pro.apk
        
        echo "=== STEP 2: Extract proto APK ==="
        mkdir -p extracted
        unzip -q app-proto.apk -d extracted
        
        echo "=== STEP 3: Set up AAB base module ==="
        mkdir -p base/manifest base/dex base/res base/assets base/root
        
        # AndroidManifest.xml (proto format)
        cp extracted/AndroidManifest.xml base/manifest/
        
        # IMPORTANT: resources.pb goes at the ROOT of base/, NOT in res/
        # This is what bundletool expects
        cp extracted/resources.pb base/
        
        # res/ folder (proto-format PNGs and XMLs)
        if [ -d extracted/res ]; then
          for item in extracted/res/*; do
            if [ -d "$item" ]; then
              dirname=$(basename "$item")
              mkdir -p "base/res/$dirname"
              cp -r "$item"/* "base/res/$dirname/" 2>/dev/null || true
            fi
          done
        fi
        
        # dex files
        ls extracted/classes*.dex 2>/dev/null | while read f; do
          cp "$f" base/dex/
        done
        
        # assets
        if [ -d extracted/assets ]; then
          cp -r extracted/assets/* base/assets/ 2>/dev/null || true
        fi
        
        # kotlin builtins to root
        if [ -d extracted/kotlin ]; then
          cp -r extracted/kotlin base/root/
        fi
        
        # META-INF/services to root
        if [ -d extracted/META-INF/services ]; then
          mkdir -p base/root/META-INF
          cp -r extracted/META-INF/services base/root/META-INF/
        fi
        
        echo "=== STEP 4: Create base.zip module ==="
        cd base
        zip -r ../base.zip . -x '*.DS_Store'
        cd ..
        
        echo "=== STEP 5: Build AAB with bundletool ==="
        java -jar bundletool.jar build-bundle \
          --modules=base.zip \
          --output=app-unsigned.aab \
          --overwrite
        
        echo "=== STEP 6: Sign AAB ==="
        $APKSIGNER sign \
          --ks release.keystore \
          --ks-pass pass:${KS_PASS} \
          --ks-key-alias ${KS_ALIAS} \
          --key-pass pass:${KP_PASS} \
          --v1-signing-enabled true \
          --v2-signing-enabled true \
          --v3-signing-enabled true \
          --v4-signing-enabled false \
          --min-sdk-version 24 \
          --out note-counter-pro.aab \
          app-unsigned.aab
        
        echo "=== STEP 7: Validate AAB ==="
        java -jar bundletool.jar validate --bundle=note-counter-pro.aab | head -20
        
        ls -lh note-counter-pro.aab

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-apk
        path: note-counter-pro.apk

    - name: Upload AAB artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-aab
        path: note-counter-pro.aab

    - name: Create Release with APK and AAB
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Delete old release if exists
        for tag in v2.7.0-recovered v2.7.0-fixed v2.8.0-closed-testing v2.8.1-closed-testing v2.8.1-vc14 v2.8.1-production v2.8.1-noiap v2.8.1-realmob v2.8.2-features v2.8.2-qrfix v2.8.3-localqr v2.8.4-fabwatcher; do
          ID=$(gh api "repos/${{ github.repository }}/releases/tags/$tag" --jq '.id' 2>/dev/null || echo "")
          if [ -n "$ID" ]; then
            gh api -X DELETE "repos/${{ github.repository }}/releases/$ID" 2>/dev/null || true
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$tag" 2>/dev/null || true
          fi
        done
        
        # Create new release with both APK and AAB
        NOTES=$(printf '# Note Counter Pro v2.8.4 (vc21 - FAB Persistence Fix)\\n\\n## Downloads\\n\\n- **note-counter-pro.aab** - AAB for Play Store upload (REQUIRED)\\n- note-counter-pro.apk - APK for direct install/test\\n\\n## Build Info\\n- Package: com.lokhnathtechnical.notecounterpro\\n- Version: 2.8.4 (versionCode: 21)\\n- AdMob: Real ads (isTesting: false, test device config ready)\\n- Play Billing Library: REMOVED\\n- Signing: v1+v2+v3 schemes\\n\\n## 🚨 MAJOR FIX in 2.8.4\\n\\n### Floating Action Button (FAB) Persistence\\n\\nUser reported: AKHON TO DEKHAI + TA O NAI APP ER BITORE\\n(translation: Now I cant see the + button inside the app)\\n\\nRoot cause:\\n- FAB was created once after 1.5s delay\\n- But Next.js/React re-renders DOM on navigation\\n- React was wiping out the FAB after each re-render\\n- FAB only visible briefly during loading screen\\n\\nFix - Multi-layered persistence:\\n1. Initial FAB creation attempts every 1 second for up to 20 seconds\\n2. MutationObserver watches document.body for child removals\\n3. Backup setInterval checks every 2 seconds - re-creates FAB if missing\\n4. Faster initial detection (DOMContentLoaded instead of full load)\\n5. FAB attaches directly to document.body (top-level, not inside React tree)\\n\\nResult: FAB now survives all React re-renders, route changes, and page navigations\\n\\n## 🆕 Previous Features\\n\\n### 💳 UPI QR Code (Local Generation - from 2.8.3)\\n- QR codes generated entirely on-device (no external API)\\n- Canvas-based - long-press to save/share\\n- Save QR Image button (base64 direct, no fetch)\\n- Share QR button (Capacitor Share + Web Share + WhatsApp fallback)\\n- Open in UPI App deep-link button\\n\\n### 📊 CSV Export (from 2.8.2)\\n- Export entries as CSV (Excel/Sheets compatible)\\n- Export customers as CSV\\n- One-click export of both\\n\\n### ⭐ Rate Us / Share App (from 2.8.2)\\n- Rate on Play Store shortcut\\n- Share app via native share sheet\\n- Send feedback via email\\n- Auto-prompt after 7 days of usage\\n\\n### 🧹 Cleanup\\n- Removed all Play Billing Library references from manifest\\n- Removed BILLING permission\\n- AdMob test device configuration ready\\n\\n## How to Upload to Play Store\\n1. Download note-counter-pro.aab\\n2. Go to https://play.google.com/console\\n3. Production -> Create new release\\n4. Upload the .aab file\\n5. Add release notes\\n6. Review and rollout')
        gh release create v2.8.4-fabwatcher \
          note-counter-pro.apk \
          note-counter-pro.aab \
          --title "Note Counter Pro v2.8.4 (vc21 - FAB Persistence Fix)" \
          --notes "$NOTES" \
          --latest
